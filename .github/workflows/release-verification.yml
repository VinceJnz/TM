name: Release verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: TinyGo client and Linux API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
        env:
          POSTGRES_USER: tm_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: tm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tm_test -d tm_test"
          --health-interval 5s --health-timeout 3s --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release identity and health policy
        shell: pwsh
        run: |
          ./scripts/test-release-policy.ps1
          ./scripts/test-release-health.ps1
          ./scripts/test-provider-sandbox-policy.ps1
          ./scripts/test-production-config.ps1

      - name: Build TinyGo client
        run: |
          docker build \
            -f Dockerfile.client1 \
            --build-arg CLIENT_BUILDER=tinygo-builder \
            -t tm-client1-wasm:tinygo \
            .

      - name: Reject generated contract drift
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo/api-server \
            golang:1.26.11-alpine@sha256:ecb67f987aa1a57794c91d19ade7ae0209f2f0f5496aaef9e6ae85ddf92d02ab \
            go run ./cmd/contracts -check

      - name: Run API tests in Linux Go 1.26
        run: |
          docker run --rm --network host \
            -e TM_TEST_DATABASE_URL=postgres://tm_test:synthetic-ci-only@127.0.0.1:5432/tm_test?sslmode=disable \
            -v "$GITHUB_WORKSPACE/api-server:/app:ro" \
            -w /app \
            golang:1.26.11-alpine@sha256:ecb67f987aa1a57794c91d19ade7ae0209f2f0f5496aaef9e6ae85ddf92d02ab \
            sh -c 'go test -count=1 ./... && go vet ./...'

      - name: Verify standard Go frontend and WASM transport
        run: |
          docker build -f Dockerfile.client1 --build-arg CLIENT_BUILDER=go-builder -t tm-client1-wasm:go-verify .
          docker run --rm -v "$GITHUB_WORKSPACE/client1:/app:ro" -w /app golang:1.26.11-alpine@sha256:ecb67f987aa1a57794c91d19ade7ae0209f2f0f5496aaef9e6ae85ddf92d02ab \
            sh -c 'apk add --no-cache nodejs bash >/dev/null && GOOS=js GOARCH=wasm go test -exec /usr/local/go/lib/wasm/go_js_wasm_exec ./...'

      - name: Build and inspect production image
        run: |
          docker build -f Dockerfile.apibuild --target final --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --build-arg CLIENT_IMAGE=tm-client1-wasm:tinygo -t tm-apiserver:verify .
          docker run --rm --entrypoint sh tm-apiserver:verify -ec \
            'id -u | grep -qx 10001; test ! -e /app/.env; test -s /app/static/main.wasm; test -s /app/static/wasm_exec.js; if find /etc/certs -type f | grep -q .; then exit 1; fi'

      - name: Verify fresh database and real-browser runtime
        shell: pwsh
        run: ./scripts/verify-runtime.ps1 -Image tm-apiserver:verify -SkipAPITests

      - name: Audit API and WASM dependencies
        shell: pwsh
        run: ./scripts/audit-dependencies.ps1

      - name: Rehearse PostgreSQL major upgrade with synthetic data
        shell: pwsh
        run: ./scripts/verify-postgres-upgrade.ps1
