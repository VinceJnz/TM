x-api: &api
  build:
    context: .
    dockerfile: Dockerfile.apibuild
    target: final
    args:
      CLIENT_IMAGE: ${CLIENT_IMAGE:-tm-client1-wasm:go-dev}
  env_file:
    - ${TM_API_ENV_FILE:-./api-server/.env}
  environment:
    DATA_SOURCE: ${TM_API_DATA_SOURCE:-}
    DEV_MODE: "false"
    EMAIL_DEBUG_ADDR: ""
    EMAIL_REDIRECT_ALL: ${TM_EMAIL_REDIRECT_ALL:-false}
    EMAIL_REDIRECT_TO: ${TM_EMAIL_REDIRECT_TO:-}
    STRIPE_TEST_MODE: ${TM_STRIPE_TEST_MODE:-false}
    DB_HOST: dbserver
    DB_PORT: "5432"
    DB_USER: ${TM_API_DB_USER:-api_user}
    DB_PASSWORD: ${TM_API_DB_PASSWORD:?Set TM_API_DB_PASSWORD outside source control}
    DB_NAME: ${TM_DB_NAME:-mydatabase}
  ports:
    - "127.0.0.1:8085:8085"
    - "8086:8086"
  depends_on:
    dbserver:
      condition: service_healthy
  networks: [mynetwork]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - ./certs/api-server:/etc/certs/ssl:ro
    - ./data/gmail-tokens:/etc/certs/gmail-tokens
    - ./data/gmail-credentials:/etc/certs/gmail-credentials:ro

services:
  dbserver:
    image: postgres:17@sha256:b60e90042aa6b8dbecd58e224b3e36114dbf8ad754465264c2476ad58a86e45c
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${TM_DB_NAME:-mydatabase}
      POSTGRES_USER: ${TM_DB_USER:-myuser}
      POSTGRES_PASSWORD: ${TM_DB_PASSWORD:?Set TM_DB_PASSWORD outside source control}
    volumes:
      - db_data_pg17:/var/lib/postgresql/data
    networks: [mynetwork]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  adminer:
    profiles: ["tools"]
    image: adminer:latest@sha256:037125c2bc4836b4917d4fd08a16f817eac2848778c4e9aab87a8340aef08dfd
    environment:
      ADMINER_DEFAULT_SERVER: dbserver
    ports: ["127.0.0.1:8082:8080"]
    networks: [mynetwork]

  apiserver:
    restart: unless-stopped
    stop_grace_period: 15s
    <<: *api
    profiles: ["prod"]

  apiserver-interactive:
    <<: *api
    profiles: ["interactive"]
    build:
      context: .
      dockerfile: Dockerfile.apibuild
      target: interactive
      args:
        CLIENT_IMAGE: ${CLIENT_IMAGE:-tm-client1-wasm:go-dev}

  apiserver-debug:
    <<: *api
    profiles: ["debug"]
    read_only: false
    build:
      context: .
      dockerfile: Dockerfile.apibuild
      target: debug
      args:
        CLIENT_IMAGE: ${CLIENT_IMAGE:-tm-client1-wasm:go-dev}
    ports:
      - "127.0.0.1:8085:8085"
      - "127.0.0.1:8086:8086"
      - "127.0.0.1:40000:40000"
    cap_add: [SYS_PTRACE]
    security_opt: ["seccomp:unconfined"]
    volumes:
      - ./certs/api-server:/etc/certs/ssl:ro
      - ./data/gmail-tokens:/etc/certs/gmail-tokens
      - ./data/gmail-credentials:/etc/certs/gmail-credentials:ro

networks:
  mynetwork:
    driver: bridge

volumes:
  # Retained for explicit PostgreSQL 13 rollback; never attach it to PostgreSQL 17.
  db_data:
  db_data_pg17:
