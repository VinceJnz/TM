# Production override: publish/approve the image separately, then deploy its digest.
# Use together with docker-compose.yml; this file never builds or publishes images.
# Use scripts/deploy-release.ps1 to validate the digest and source revision first.
services:
  apiserver:
    image: ${TM_RELEASE_API_IMAGE:?Set TM_RELEASE_API_IMAGE to the approved registry image digest}
    build: !reset null
